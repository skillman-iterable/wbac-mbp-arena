<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WBAC D3 Brush Scatter v2</title>
  <style>
    html, body, #root { margin: 0; width: 100%; height: 100%; background: #f8fafc; font-family: system-ui, sans-serif; }
    #root { display: flex; flex-direction: column; box-sizing: border-box; padding: 12px 14px; overflow: hidden; }
    h2 { margin: 0 0 4px; font-size: 16px; color: #0f172a; }
    .sub { margin: 0 0 8px; font-size: 12px; color: #64748b; max-width: 72ch; }
    .main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0; }
    .chart-wrap { flex: 0 0 52%; min-height: 200px; display: flex; flex-direction: column; }
    .chart-host { flex: 1; min-height: 160px; position: relative; }
    .chart-host svg { display: block; width: 100%; height: 100%; }
    circle.dot { opacity: 0.55; stroke: #fff; stroke-width: 1px; }
    circle.dot.selected { opacity: 1 !important; stroke: #0f172a; stroke-width: 1.5px; }
    .selection-hud { font-size: 12px; color: #334155; padding: 6px 0 4px; }
    .data-table-panel {
      flex: 1; min-height: 120px; overflow: auto;
      border-top: 1px solid #e2e8f0; padding-top: 10px; margin-top: 4px;
    }
    .data-table-panel h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: #0f172a; }
    .data-table-panel table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .data-table-panel th {
      text-align: left; padding: 6px 8px; background: #f1f5f9; color: #475569;
      font-weight: 600; position: sticky; top: 0; z-index: 1;
    }
    .data-table-panel td { padding: 5px 8px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    .data-table-panel tr.brushed td { background: #e0f2fe; }
    .data-table-panel td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .table-meta { font-size: 11px; color: #64748b; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@sigmacomputing/plugin"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
(function () {
  const { useState, useEffect, useRef, createElement: h } = React;

  const DEMO = d3.range(120).map((i) => ({
    x: 4 + Math.random() * 4,
    y: Math.random() * 9,
    g: ['setosa', 'versicolor', 'virginica'][i % 3],
    rowIndex: i,
  }));

  const DEMO_ROWS = DEMO.map((p) => ({
    group: p.g,
    x: p.x,
    y: p.y,
  }));

  const PALETTE = ['#440154', '#21908d', '#fde725', '#3b82f6', '#ef4444', '#a855f7', '#14b8a6'];
  const TABLE_CAP = 500;

  function colId(cfg, key) {
    const v = cfg && cfg[key];
    if (!v) return null;
    if (typeof v === 'string') return v;
    return v.columnId || null;
  }

  function elementId(cfg, key) {
    const v = cfg && cfg[key];
    if (!v) return null;
    if (typeof v === 'string') return v;
    return v.elementId || null;
  }

  function shortColName(id) {
    if (!id) return '';
    const slash = String(id).lastIndexOf('/');
    return slash >= 0 ? String(id).slice(slash + 1) : String(id);
  }

  function fmtCell(v) {
    if (v == null || v === '') return '—';
    if (v instanceof Date) return v.toISOString().slice(0, 10);
    if (typeof v === 'number' && isFinite(v)) {
      return Math.abs(v) >= 1000 ? v.toLocaleString(undefined, { maximumFractionDigits: 0 }) : String(v);
    }
    return String(v);
  }

  function parseDataset(data, cfg) {
    if (!data || !cfg) return null;
    const xCol = colId(cfg, 'x');
    const yCol = colId(cfg, 'y');
    const gCol = colId(cfg, 'group');
    const dateCol = colId(cfg, 'date');
    if (!xCol || !yCol || !data[xCol] || !data[yCol]) return null;
    const n = data[xCol].length;
    if (!n) return null;

    const rows = [];
    const points = [];
    for (let i = 0; i < n; i++) {
      const rawX = data[xCol][i];
      const rawY = data[yCol][i];
      let x = rawX instanceof Date ? rawX.getTime() : Number(rawX);
      const y = Number(rawY);
      if (!isFinite(x) || !isFinite(y)) continue;
      const g = gCol && data[gCol] ? String(data[gCol][i] ?? '') : 'all';
      const row = {
        group: g,
        x: rawX instanceof Date ? rawX : x,
        y,
        xNum: x,
        yNum: y,
        date: dateCol && data[dateCol] ? data[dateCol][i] : null,
      };
      rows.push(row);
      points.push({ x, y, g, rowIndex: rows.length - 1 });
    }
    if (!points.length) return null;

    let plotPoints = points;
    if (points.length > 2500) {
      const step = Math.ceil(points.length / 2500);
      plotPoints = points.filter((_, i) => i % step === 0);
    }

    const headers = [
      { key: 'group', label: gCol ? shortColName(gCol) : 'Group' },
      ...(dateCol ? [{ key: 'date', label: shortColName(dateCol) }] : []),
      { key: 'x', label: (cfg.xLabel || shortColName(xCol) || 'X') },
      { key: 'y', label: (cfg.yLabel || shortColName(yCol) || 'Y') },
    ];

    return { rows, plotPoints, headers };
  }

  function BrushChart({ points, xLabel, yLabel, onBrushChange }) {
    const hostRef = useRef(null);
    const onBrushRef = useRef(onBrushChange);
    onBrushRef.current = onBrushChange;

    useEffect(() => {
      const host = hostRef.current;
      if (!host || !points.length) return;

      host.innerHTML = '';
      const ro = new ResizeObserver(() => draw());
      ro.observe(host);
      draw();
      return () => ro.disconnect();

      function draw() {
        const rect = host.getBoundingClientRect();
        const width = Math.max(280, rect.width);
        const height = Math.max(220, rect.height);
        const margin = { top: 12, right: 18, bottom: 36, left: 52 };
        const iw = width - margin.left - margin.right;
        const ih = height - margin.top - margin.bottom;

        d3.select(host).selectAll('svg').remove();
        const svg = d3.select(host).append('svg').attr('width', width).attr('height', height);
        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        const x = d3.scaleLinear()
          .domain(d3.extent(points, (d) => d.x)).nice()
          .range([0, iw]);
        const y = d3.scaleLinear()
          .domain(d3.extent(points, (d) => d.y)).nice()
          .range([ih, 0]);

        const groups = [...new Set(points.map((d) => d.g))];
        const color = d3.scaleOrdinal().domain(groups).range(PALETTE);

        g.append('g').attr('transform', `translate(0,${ih})`).call(d3.axisBottom(x).ticks(8));
        g.append('g').call(d3.axisLeft(y).ticks(8));
        g.append('text').attr('x', iw / 2).attr('y', ih + 30).attr('text-anchor', 'middle')
          .attr('fill', '#64748b').attr('font-size', 11).text(xLabel || 'X');
        g.append('text').attr('transform', 'rotate(-90)').attr('x', -ih / 2).attr('y', -42)
          .attr('text-anchor', 'middle').attr('fill', '#64748b').attr('font-size', 11).text(yLabel || 'Y');

        const dots = g.append('g').selectAll('circle').data(points).join('circle')
          .attr('class', 'dot')
          .attr('cx', (d) => x(d.x))
          .attr('cy', (d) => y(d.y))
          .attr('r', 6)
          .attr('fill', (d) => color(d.g));

        function isBrushed(sel, cx, cy) {
          const [[x0, y0], [x1, y1]] = sel;
          return x0 <= cx && cx <= x1 && y0 <= cy && cy <= y1;
        }

        function emitSelection(sel) {
          if (!sel) {
            onBrushRef.current(null);
            return;
          }
          const [[px0, py0], [px1, py1]] = sel;
          const x0 = x.invert(px0);
          const x1 = x.invert(px1);
          const y0 = y.invert(py0);
          const y1 = y.invert(py1);
          onBrushRef.current({
            x0: Math.min(x0, x1),
            x1: Math.max(x0, x1),
            y0: Math.min(y0, y1),
            y1: Math.max(y0, y1),
          });
        }

        const brush = d3.brush()
          .extent([[0, 0], [iw, ih]])
          .on('start brush end', (event) => {
            const sel = event.selection;
            if (!sel) {
              dots.classed('selected', false);
              emitSelection(null);
              return;
            }
            dots.classed('selected', (d) => isBrushed(sel, x(d.x), y(d.y)));
            emitSelection(sel);
          });

        g.append('g').attr('class', 'brush').call(brush);
      }
    }, [points, xLabel, yLabel]);

    return h('div', { className: 'chart-host', ref: hostRef });
  }

  function filterRowsByBrush(rows, box) {
    if (!box) return rows;
    return rows.filter((r) => {
      const xn = r.xNum != null ? r.xNum : Number(r.x);
      const yn = r.yNum != null ? r.yNum : Number(r.y);
      return xn >= box.x0 && xn <= box.x1 && yn >= box.y0 && yn <= box.y1;
    });
  }

  function BrushTable({ rows, headers, brushBox, totalRows }) {
    const brushing = !!brushBox;
    const filtered = brushing ? filterRowsByBrush(rows, brushBox) : rows;
    const capped = filtered.length > TABLE_CAP ? filtered.slice(0, TABLE_CAP) : filtered;

    let meta;
    if (brushing) {
      meta = `Showing ${filtered.length.toLocaleString()} brushed row${filtered.length === 1 ? '' : 's'}`
        + (filtered.length > TABLE_CAP ? ` (first ${TABLE_CAP} in table)` : '');
    } else {
      meta = `No brush active — all ${totalRows.toLocaleString()} rows. Drag a rectangle on the chart to filter.`
        + (totalRows > TABLE_CAP ? ` (table shows first ${TABLE_CAP})` : '');
    }

    return h('div', { className: 'data-table-panel' },
      h('h3', null, 'Brushed selection (table)'),
      h('p', { className: 'table-meta' }, meta),
      h('table', null,
        h('thead', null,
          h('tr', null, headers.map((col) => h('th', { key: col.key }, col.label)))
        ),
        h('tbody', null,
          capped.map((row, i) => h('tr', {
            key: i,
            className: brushing ? 'brushed' : '',
          },
            headers.map((col) => h('td', {
              key: col.key,
              className: col.key === 'x' || col.key === 'y' ? 'num' : '',
            }, fmtCell(row[col.key])))
          ))
        )
      )
    );
  }

  function App() {
    const [plotPoints, setPlotPoints] = useState(DEMO);
    const [rows, setRows] = useState(DEMO_ROWS);
    const [headers, setHeaders] = useState([
      { key: 'group', label: 'Species' },
      { key: 'x', label: 'Sepal length' },
      { key: 'y', label: 'Petal length' },
    ]);
    const [xLabel, setXLabel] = useState('Sepal length (demo)');
    const [yLabel, setYLabel] = useState('Petal length (demo)');
    const [brushBox, setBrushBox] = useState(null);

    const filteredCount = brushBox ? filterRowsByBrush(rows, brushBox).length : 0;

    const handleBrushChange = (box) => {
      setBrushBox(box);
    };

    useEffect(() => {
      const client = (window.SigmaPlugin && window.SigmaPlugin.client) || (window.Sigma && window.Sigma.client);
      if (!client) return;

      client.config.configureEditorPanel([
        { name: 'source', type: 'element' },
        { name: 'x', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number', 'integer', 'datetime'] },
        { name: 'y', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number', 'integer'] },
        { name: 'group', type: 'column', source: 'source', allowMultiple: false },
        { name: 'date', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['datetime', 'date'] },
        { name: 'xLabel', type: 'text', defaultValue: 'X axis' },
        { name: 'yLabel', type: 'text', defaultValue: 'Y axis' },
      ]);

      let unsubData = null;
      const unsubCfg = client.config.subscribe((cfg) => {
        if (unsubData) { unsubData(); unsubData = null; }
        setXLabel((cfg && cfg.xLabel) || 'X');
        setYLabel((cfg && cfg.yLabel) || 'Y');
        const sid = elementId(cfg, 'source');
        if (!sid) {
          setPlotPoints(DEMO);
          setRows(DEMO_ROWS);
          setBrushBox(null);
          return;
        }
        unsubData = client.elements.subscribeToElementData(sid, (data) => {
          const parsed = parseDataset(data, cfg);
          if (parsed) {
            setPlotPoints(parsed.plotPoints);
            setRows(parsed.rows);
            setHeaders(parsed.headers);
            setBrushBox(null);
          } else {
            setPlotPoints(DEMO);
            setRows(DEMO_ROWS);
            setBrushBox(null);
          }
        });
      });
      return () => { if (unsubData) unsubData(); if (unsubCfg) unsubCfg(); };
    }, []);

    const hudText = brushBox
      ? `Brushing active — ${filteredCount.toLocaleString()} / ${rows.length.toLocaleString()} rows in selection.`
      : `Drag a rectangle to brush (D3 Graph Gallery pattern). ${plotPoints.length.toLocaleString()} points plotted.`;

    return h('div', { style: { height: '100%', display: 'flex', flexDirection: 'column', minHeight: 0 } },
      h('h2', null, 'D3 brush scatter'),
      h('p', { className: 'sub' },
        'Brush the scatterplot; the table below lists only the rows inside your selection.'
      ),
      h('div', { className: 'main' },
        h('div', { className: 'chart-wrap' },
          h(BrushChart, { points: plotPoints, xLabel, yLabel, onBrushChange: handleBrushChange }),
          h('div', { className: 'selection-hud' }, hudText)
        ),
        h(BrushTable, {
          rows,
          headers,
          brushBox,
          totalRows: rows.length,
        })
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
  </script>
</body>
</html>
