<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WBAC MBP Thunderdome v5</title>
  <link rel="stylesheet" href="https://unpkg.com/react-calendar-heatmap@1.9.0/dist/styles.css" />
  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #root { position: relative; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
      box-sizing: border-box;
    }
    .hud-top h1 {
      margin: 0;
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #f8fafc;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
    }
    .hud-top p {
      margin: 6px 0 0;
      color: #94a3b8;
      font-size: 13px;
      max-width: 52ch;
    }
    .hud-bottom {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .chip {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 120px;
      backdrop-filter: blur(8px);
    }
    .chip strong { display: block; color: #e2e8f0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .chip span { color: #38bdf8; font-size: 20px; font-weight: 700; }
    .legend {
      pointer-events: none;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 11px;
      color: #94a3b8;
    }
    .legend i {
      display: inline-block;
      width: 36px;
      height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
    }
    .focus-card {
      pointer-events: none;
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.25);
    }
    .rank-panel {
      flex: 0 0 22%;
      min-height: 100px;
      max-height: 28%;
      overflow-y: auto;
      padding: 8px 16px 12px;
      background: linear-gradient(180deg, rgba(7, 11, 20, 0) 0%, rgba(7, 11, 20, 0.95) 12%);
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      pointer-events: auto;
    }
    .rank-row {
      display: grid;
      grid-template-columns: 88px 1fr 72px;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 8px;
    }
    .rank-row:hover, .rank-row.active {
      background: rgba(56, 189, 248, 0.12);
    }
    .rank-name {
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-track {
      height: 10px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
    }
    .rank-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }
    .rank-pct {
      color: #94a3b8;
      font-size: 11px;
      text-align: right;
    }
    .arena-wrap {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      min-height: 0;
    }
    .arena-canvas-wrap {
      flex: 1 1 42%;
      position: relative;
      min-height: 160px;
    }
    .data-table-panel {
      flex: 0 0 24%;
      min-height: 100px;
      max-height: 28%;
      overflow: auto;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(15, 23, 42, 0.92);
      pointer-events: auto;
    }
    .data-table-panel h3 {
      margin: 0;
      padding: 8px 12px 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .data-table-panel table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .data-table-panel th {
      position: sticky;
      top: 0;
      background: #0f172a;
      color: #cbd5e1;
      text-align: left;
      padding: 6px 10px;
      border-bottom: 1px solid #334155;
    }
    .data-table-panel td {
      padding: 5px 10px;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }
    .data-table-panel tr:hover td { background: rgba(56, 189, 248, 0.08); }
    .data-table-panel tr.active td { background: rgba(56, 189, 248, 0.15); }
    .data-table-panel td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .heatmap-panel {
      flex: 0 0 26%;
      min-height: 110px;
      padding: 8px 12px 12px;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      background: #0f172a;
      overflow-x: auto;
      pointer-events: auto;
    }
    .heatmap-panel h3 {
      margin: 0 0 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
    }
    .heatmap-panel .react-calendar-heatmap { width: 100%; min-width: 520px; }
    .heatmap-panel .react-calendar-heatmap .color-empty { fill: #1e293b; }
    .heatmap-panel .react-calendar-heatmap .color-scale-1 { fill: #164e63; }
    .heatmap-panel .react-calendar-heatmap .color-scale-2 { fill: #0891b2; }
    .heatmap-panel .react-calendar-heatmap .color-scale-3 { fill: #22d3ee; }
    .heatmap-panel .react-calendar-heatmap .color-scale-4 { fill: #67e8f9; }
    .heatmap-panel .react-calendar-heatmap text { fill: #64748b; font-size: 8px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@sigmacomputing/plugin"></script>
  <script src="https://unpkg.com/react-calendar-heatmap@1.9.0/dist/react-calendar-heatmap.umd.js"></script>
  <script>
(function () {
  const { useState, useEffect, useRef, useMemo, createElement: h } = React;

  const SYNTH = [
    { mbp: 'Gmail', sent: 9.2e9, bounced: 1.1e8, clicks: 4.5e8, opens: 2.1e9 },
    { mbp: 'Yahoo', sent: 2.4e9, bounced: 4.2e7, clicks: 9.8e7, opens: 5.1e8 },
    { mbp: 'Microsoft', sent: 3.8e9, bounced: 5.5e7, clicks: 1.4e8, opens: 8.2e8 },
    { mbp: 'Apple', sent: 1.6e9, bounced: 1.2e7, clicks: 6.2e7, opens: 4.4e8 },
    { mbp: 'Comcast', sent: 0.9e9, bounced: 2.8e7, clicks: 3.1e7, opens: 1.9e8 },
    { mbp: 'Other', sent: 5.1e9, bounced: 9.4e7, clicks: 2.2e8, opens: 1.1e9 },
  ];

  function fmt(n) {
    const x = Number(n);
    if (!isFinite(x)) return '—';
    const abs = Math.abs(x);
    if (abs >= 1e12) return (x / 1e12).toFixed(2) + 'T';
    if (abs >= 1e9) return (x / 1e9).toFixed(2) + 'B';
    if (abs >= 1e6) return (x / 1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return (x / 1e3).toFixed(1) + 'K';
    return Math.round(x).toLocaleString();
  }

  /** Pivot/element feeds often return many rows per MBP — roll up before viz. */
  function aggregateByMbp(rows) {
    const map = new Map();
    rows.forEach((r) => {
      const key = r.mbp.trim();
      if (!key) return;
      const cur = map.get(key) || { mbp: key, sent: 0, bounced: 0, clicks: 0, opens: 0 };
      cur.sent += r.sent;
      cur.bounced += r.bounced;
      cur.clicks += r.clicks;
      cur.opens += r.opens;
      map.set(key, cur);
    });
    let out = Array.from(map.values()).filter((r) => r.sent > 0).sort((a, b) => b.sent - a.sent);
    const TOP = 10;
    if (out.length > TOP) {
      const head = out.slice(0, TOP);
      const tail = out.slice(TOP);
      head.push({
        mbp: 'Other',
        sent: tail.reduce((a, r) => a + r.sent, 0),
        bounced: tail.reduce((a, r) => a + r.bounced, 0),
        clicks: tail.reduce((a, r) => a + r.clicks, 0),
        opens: tail.reduce((a, r) => a + r.opens, 0),
      });
      out = head;
    }
    return out;
  }

  function bounceRate(sent, bounced) {
    const s = Number(sent), b = Number(bounced);
    if (!isFinite(s) || s <= 0) return 0;
    return b / s;
  }

  function colorForRate(rate) {
    const t = Math.max(0, Math.min(1, rate / 0.04));
    const r = Math.round(34 + t * (239 - 34));
    const g = Math.round(197 - t * (197 - 68));
    const b = Math.round(94 - t * 94);
    return `rgb(${r},${g},${b})`;
  }

  function colId(cfg, key) {
    const v = cfg && cfg[key];
    if (!v) return null;
    if (typeof v === 'string') return v;
    return v.columnId || null;
  }

  function elementId(cfg, key) {
    const v = cfg && cfg[key];
    if (!v) return null;
    if (typeof v === 'string') return v;
    return v.elementId || null;
  }

  function parseRows(data, cfg) {
    if (!data || !cfg) return null;
    const mbp = colId(cfg, 'mbp');
    const sent = colId(cfg, 'sent');
    const bounced = colId(cfg, 'bounced');
    const clicks = colId(cfg, 'clicks');
    const opens = colId(cfg, 'opens');
    if (!mbp || !sent || !bounced || !data[mbp] || !data[sent] || !data[bounced]) return null;
    const n = data[mbp].length;
    if (!n) return null;
    const rows = [];
    for (let i = 0; i < n; i++) {
      const label = data[mbp][i];
      if (label == null || label === '') continue;
      rows.push({
        mbp: String(label),
        sent: Number(data[sent][i]) || 0,
        bounced: Number(data[bounced][i]) || 0,
        clicks: clicks && data[clicks] ? Number(data[clicks][i]) || 0 : 0,
        opens: opens && data[opens] ? Number(data[opens][i]) || 0 : 0,
      });
    }
    return rows.length ? aggregateByMbp(rows) : null;
  }

  function dayKey(raw) {
    if (raw == null) return null;
    const d = raw instanceof Date ? raw : new Date(raw);
    if (isNaN(d.getTime())) return null;
    return d.toISOString().slice(0, 10);
  }

  function parseHeatmap(data, cfg) {
    const dateCol = colId(cfg, 'heatDate');
    const valueCol = colId(cfg, 'heatValue');
    if (!data || !dateCol || !valueCol || !data[dateCol] || !data[valueCol]) return null;
    const map = new Map();
    const n = data[dateCol].length;
    for (let i = 0; i < n; i++) {
      const key = dayKey(data[dateCol][i]);
      if (!key) continue;
      const v = Number(data[valueCol][i]) || 0;
      map.set(key, (map.get(key) || 0) + v);
    }
    const values = Array.from(map, ([date, count]) => ({ date, count }));
    return values.length ? values : null;
  }

  function demoHeatmap() {
    const out = [];
    const end = new Date();
    for (let i = 0; i < 365; i++) {
      const d = new Date(end);
      d.setDate(d.getDate() - i);
      out.push({ date: d.toISOString().slice(0, 10), count: Math.floor(Math.random() * 12) });
    }
    return out;
  }

  function SendHeatmap({ values }) {
    const Cal = (window.CalendarHeatmap && (window.CalendarHeatmap.default || window.CalendarHeatmap));
    const endDate = useMemo(() => new Date(), []);
    const startDate = useMemo(() => {
      const s = new Date();
      s.setFullYear(s.getFullYear() - 1);
      return s;
    }, []);
    const max = useMemo(() => Math.max(...values.map((v) => v.count), 1), [values]);
    if (!Cal) {
      return h('div', { className: 'heatmap-panel' }, h('h3', null, 'Daily send heatmap'), h('p', { style: { color: '#94a3b8', fontSize: 12 } }, 'Calendar heatmap library failed to load.'));
    }
    return h(
      'div',
      { className: 'heatmap-panel' },
      h('h3', null, 'Daily send volume (react-calendar-heatmap)'),
      h(Cal, {
        startDate,
        endDate,
        values,
        showWeekdayLabels: true,
        showMonthLabels: true,
        classForValue: (value) => {
          if (!value || !value.count) return 'color-empty';
          const t = value.count / max;
          if (t < 0.25) return 'color-scale-1';
          if (t < 0.5) return 'color-scale-2';
          if (t < 0.75) return 'color-scale-3';
          return 'color-scale-4';
        },
        titleForValue: (value) => (value && value.date ? value.date + ': ' + fmt(value.count) + ' sent' : 'No data'),
      })
    );
  }

  function computeLayout(sorted, w, h) {
    const n = sorted.length;
    if (!n) return [];
    const cx = w * 0.5;
    const cy = h * 0.5;
    const minDim = Math.min(w, h);
    const maxSent = Math.max(...sorted.map((r) => r.sent), 1);
    const rMin = minDim * 0.028;
    const rMax = minDim * 0.052;
    const orbit = minDim * (n <= 5 ? 0.26 : 0.3);
    const nodes = sorted.map((row, i) => {
      const share = row.sent / maxSent;
      const radius = rMin + Math.sqrt(share) * (rMax - rMin);
      const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
      return {
        row,
        radius,
        x: cx + Math.cos(angle) * orbit,
        y: cy + Math.sin(angle) * orbit * 0.92,
      };
    });
    for (let iter = 0; iter < 100; iter++) {
      for (let i = 0; i < n; i++) {
        for (let j = i + 1; j < n; j++) {
          const a = nodes[i];
          const b = nodes[j];
          let dx = b.x - a.x;
          let dy = b.y - a.y;
          let dist = Math.hypot(dx, dy);
          if (dist < 1e-3) {
            dist = 1e-3;
            dx = 1;
            dy = 0;
          }
          const need = a.radius + b.radius + 10;
          if (dist < need) {
            const push = (need - dist) * 0.55;
            const ux = dx / dist;
            const uy = dy / dist;
            a.x -= ux * push;
            a.y -= uy * push;
            b.x += ux * push;
            b.y += uy * push;
          }
        }
      }
      nodes.forEach((node) => {
        node.x = cx + (node.x - cx) * 0.992;
        node.y = cy + (node.y - cy) * 0.992;
      });
    }
    return nodes;
  }

  function DataTable({ rows, focus, setFocus }) {
    return h(
      'div',
      { className: 'data-table-panel' },
      h('h3', null, 'Data behind this visual'),
      h(
        'table',
        null,
        h(
          'thead',
          null,
          h('tr', null,
            h('th', null, 'MBP'),
            h('th', null, 'Sent'),
            h('th', null, 'Bounced'),
            h('th', null, 'Bounce %'),
            h('th', null, 'Clicks'),
            h('th', null, 'Opens')
          )
        ),
        h(
          'tbody',
          null,
          rows.map((row) => {
            const rate = bounceRate(row.sent, row.bounced);
            const active = focus && focus.mbp === row.mbp;
            return h(
              'tr',
              {
                key: row.mbp,
                className: active ? 'active' : '',
                onClick: () => setFocus(row),
                style: { cursor: 'pointer' },
              },
              h('td', null, row.mbp),
              h('td', { className: 'num' }, fmt(row.sent)),
              h('td', { className: 'num' }, fmt(row.bounced)),
              h('td', { className: 'num' }, (rate * 100).toFixed(2) + '%'),
              h('td', { className: 'num' }, fmt(row.clicks)),
              h('td', { className: 'num' }, fmt(row.opens))
            );
          })
        )
      )
    );
  }

  function RankBars({ rows, focus, setFocus, maxSent }) {
    const top = rows.slice(0, 8);
    return h(
      'div',
      { className: 'rank-panel' },
      top.map((row) => {
        const rate = bounceRate(row.sent, row.bounced);
        const active = focus && focus.mbp === row.mbp;
        const widthPct = maxSent > 0 ? Math.max(2, (row.sent / maxSent) * 100) : 0;
        return h(
          'div',
          {
            key: row.mbp,
            className: 'rank-row' + (active ? ' active' : ''),
            onClick: () => setFocus(row),
          },
          h('div', { className: 'rank-name', title: row.mbp }, row.mbp),
          h(
            'div',
            { className: 'rank-track' },
            h('div', {
              className: 'rank-fill',
              style: { width: widthPct + '%', background: colorForRate(rate) },
            })
          ),
          h('div', { className: 'rank-pct' }, (rate * 100).toFixed(2) + '%')
        );
      })
    );
  }

  function Arena({ rows, title, focus, setFocus, heatmapValues }) {
    const canvasRef = useRef(null);
    const animRef = useRef(0);
    const sizeRef = useRef({ w: 800, h: 500 });
    const layoutRef = useRef([]);

    const sorted = useMemo(() => [...rows].sort((a, b) => b.sent - a.sent), [rows]);
    const maxSent = sorted[0]?.sent || 1;

    const stats = useMemo(() => {
      const totalSent = rows.reduce((a, r) => a + r.sent, 0);
      const totalBounced = rows.reduce((a, r) => a + r.bounced, 0);
      const avgBounce = bounceRate(totalSent, totalBounced);
      const leader = sorted[0] || null;
      return { totalSent, totalBounced, avgBounce, leader, count: rows.length };
    }, [rows, sorted]);

    useEffect(() => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const root = canvas.parentElement;
      let t0 = performance.now();

      function draw(now) {
        const t = (now - t0) / 1000;
        const rect = root.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(320, rect.width);
        const h = Math.max(240, rect.height);
        sizeRef.current = { w, h };
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        ctx.fillStyle = '#070b14';
        ctx.fillRect(0, 0, w, h);

        const cx = w * 0.5;
        const cy = h * 0.5;
        const nodes = computeLayout(sorted, w, h);
        layoutRef.current = nodes;

        for (let i = 0; i < 2; i++) {
          ctx.beginPath();
          ctx.strokeStyle = `rgba(56, 189, 248, ${0.1 + i * 0.05})`;
          ctx.lineWidth = 1;
          const guideR = Math.min(w, h) * (0.22 + i * 0.1) + Math.sin(t * 0.6 + i) * 2;
          ctx.arc(cx, cy, guideR, 0, Math.PI * 2);
          ctx.stroke();
        }

        nodes.forEach((node, idx) => {
          const { row, x, y, radius } = node;
          const rate = bounceRate(row.sent, row.bounced);
          const isFocus = focus && focus.mbp === row.mbp;
          const pulse = 1 + (isFocus ? 0.06 : 0.02) * Math.sin(t * 2.5 + idx);
          const r = radius * pulse;
          const labelR = r + 14;
          const ang = Math.atan2(y - cy, x - cx);
          const lx = x + Math.cos(ang) * labelR;
          const ly = y + Math.sin(ang) * labelR;

          ctx.beginPath();
          ctx.fillStyle = colorForRate(rate);
          ctx.globalAlpha = isFocus ? 1 : 0.9;
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;

          ctx.beginPath();
          ctx.strokeStyle = isFocus ? '#38bdf8' : 'rgba(248, 250, 252, 0.35)';
          ctx.lineWidth = isFocus ? 2.5 : 1;
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#f1f5f9';
          ctx.font = '600 11px sans-serif';
          ctx.textAlign = Math.cos(ang) > 0.2 ? 'left' : Math.cos(ang) < -0.2 ? 'right' : 'center';
          ctx.textBaseline = 'middle';
          const short = row.mbp.length > 14 ? row.mbp.slice(0, 12) + '…' : row.mbp;
          ctx.fillText(short, lx, ly);
        });

        animRef.current = requestAnimationFrame(draw);
      }

      animRef.current = requestAnimationFrame(draw);
      const ro = new ResizeObserver(() => {
        cancelAnimationFrame(animRef.current);
        animRef.current = requestAnimationFrame(draw);
      });
      ro.observe(root);
      return () => {
        cancelAnimationFrame(animRef.current);
        ro.disconnect();
      };
    }, [sorted, focus]);

    const focused = focus || stats.leader;

    return h('div', { className: 'arena-wrap' },
      h('div', { className: 'arena-canvas-wrap' },
        h('canvas', { ref: canvasRef }),
        h('div', { className: 'hud' },
          h('div', { className: 'hud-top' },
            h('h1', null, title || 'MBP Thunderdome'),
            h('p', null, 'Ring = one MBP per dot (size ≈ sends, color = bounce). Use the rank list below — click any row to spotlight.')
          ),
          h('div', { className: 'hud-bottom' },
            h('div', { className: 'chip' },
              h('strong', null, 'Providers'),
              h('span', null, String(stats.count))
            ),
            h('div', { className: 'chip' },
              h('strong', null, 'Total sent'),
              h('span', null, fmt(stats.totalSent))
            ),
            h('div', { className: 'chip' },
              h('strong', null, 'Avg bounce'),
              h('span', null, (stats.avgBounce * 100).toFixed(2) + '%')
            ),
            focused && h('div', { className: 'chip focus-card' },
              h('strong', null, focused.mbp),
              h('span', null, (bounceRate(focused.sent, focused.bounced) * 100).toFixed(2) + '% bounce')
            ),
            h('div', { className: 'legend' },
              h('i'), 'Healthy → stressed'
            )
          )
        ),
        h(ClickLayer, { layoutRef, focus, setFocus, canvasRef })
      ),
      h(RankBars, { rows: sorted, focus, setFocus, maxSent }),
      h(DataTable, { rows: sorted, focus, setFocus }),
      h(SendHeatmap, { values: heatmapValues })
    );
  }

  function ClickLayer({ layoutRef, focus, setFocus, canvasRef }) {
    const onClick = (e) => {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const nodes = layoutRef.current || [];
      let hit = null;
      nodes.forEach((node) => {
        const dx = x - node.x;
        const dy = y - node.y;
        if (dx * dx + dy * dy <= node.radius * node.radius) hit = node.row;
      });
      setFocus(hit || focus);
    };
    return h('div', {
      style: { position: 'absolute', inset: 0, cursor: 'pointer' },
      onClick,
    });
  }

  function App() {
    const [rows, setRows] = useState(SYNTH);
    const [title, setTitle] = useState('MBP Thunderdome');
    const [focus, setFocus] = useState(null);
    const [heatmapValues, setHeatmapValues] = useState(demoHeatmap());

    useEffect(() => {
      const client = (window.SigmaPlugin && window.SigmaPlugin.client) || (window.Sigma && window.Sigma.client);
      if (!client) return;

      client.config.configureEditorPanel([
        { name: 'source', type: 'element' },
        { name: 'dailySource', type: 'element' },
        { name: 'mbp', type: 'column', source: 'source', allowMultiple: false },
        { name: 'sent', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number', 'integer'] },
        { name: 'bounced', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number', 'integer'] },
        { name: 'clicks', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number', 'integer'] },
        { name: 'opens', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number', 'integer'] },
        { name: 'heatDate', type: 'column', source: 'dailySource', allowMultiple: false, allowedTypes: ['datetime', 'date'] },
        { name: 'heatValue', type: 'column', source: 'dailySource', allowMultiple: false, allowedTypes: ['number', 'integer'] },
        { name: 'title', type: 'text', defaultValue: 'MBP Thunderdome' },
      ]);

      let unsubData = null;
      let unsubHeat = null;
      const unsubCfg = client.config.subscribe((config) => {
        if (unsubData) { unsubData(); unsubData = null; }
        if (unsubHeat) { unsubHeat(); unsubHeat = null; }
        setTitle((config && config.title) || 'MBP Thunderdome');
        const sourceId = elementId(config, 'source');
        const dailyId = elementId(config, 'dailySource');
        if (!sourceId) {
          setRows(SYNTH);
        } else {
          unsubData = client.elements.subscribeToElementData(sourceId, (data) => {
            const parsed = parseRows(data, config);
            setRows(parsed || SYNTH);
            setFocus(null);
          });
        }
        if (dailyId && colId(config, 'heatDate') && colId(config, 'heatValue')) {
          unsubHeat = client.elements.subscribeToElementData(dailyId, (data) => {
            setHeatmapValues(parseHeatmap(data, config) || demoHeatmap());
          });
        } else {
          setHeatmapValues(demoHeatmap());
        }
      });
      return () => {
        if (unsubData) unsubData();
        if (unsubHeat) unsubHeat();
        if (unsubCfg) unsubCfg();
      };
    }, []);

    return h(Arena, { rows, title, focus, setFocus, heatmapValues });
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(h(App));
})();
  </script>
</body>
